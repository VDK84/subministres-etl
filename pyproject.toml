[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "subministres-etl"
version = "0.2.0"
description = "ETL i interfície web de gestió de factures de subministraments (Aigua, Gas, Llum, Telefonia) per desar a NAS i InfluxDB"
authors = [{ name = "VDK84" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "influxdb-client>=1.38.0",
    "playwright>=1.47.0",
    "pypdf>=4.3.0",
    "pdfplumber>=0.11.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.3",
    "rich>=13.7.1",
    "python-dateutil>=2.9.0",
    "tenacity>=8.3.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
]

[project.scripts]
subministres-etl = "src.main:main"
subministres-web = "src.web.app:start"

[tool.pyright]
reportMissingImports = false
reportMissingTypeStubs = false

[tool.ruff]
line-length = 120
target-version = "py311"
